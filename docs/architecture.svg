<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
<defs>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#172554}.subtitle{font:16px Arial,sans-serif;fill:#475569}
    .head{font:700 22px Arial,sans-serif;fill:#16223b}.subhead{font:700 16px Arial,sans-serif;fill:#16223b}
    .text{font:15px Arial,sans-serif;fill:#243247}.small{font:13px Arial,sans-serif;fill:#475569}.ip{font:700 16px Arial,sans-serif;fill:#075985}
    .vpcA{fill:#effaf1;stroke:#25a244;stroke-width:2.5}.vpcB{fill:#fff3f2;stroke:#e24a45;stroke-width:2.5}
    .public{fill:#f4f9e9;stroke:#78b82a;stroke-width:2;stroke-dasharray:7 5}.private{fill:#eaf6ff;stroke:#48a7e8;stroke-width:2;stroke-dasharray:7 5}
    .route{fill:#f7f3ff;stroke:#8b5cf6;stroke-width:2}.inst{fill:#fff;stroke:#f28c28;stroke-width:2}
    .line{stroke:#334155;stroke-width:3;fill:none}.purple{stroke:#7c3aed;stroke-width:4;fill:none}
    .green{stroke:#16a34a;stroke-width:4;fill:none}.blue{stroke:#2563eb;stroke-width:4;fill:none}
    .routehead{font:700 17px Arial,sans-serif;fill:#5b21b6}.mono{font:14px Consolas,monospace;fill:#1e293b}
  </style>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
  <marker id="purpleArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
  <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
</defs>
<rect width="1600" height="1060" fill="#fff"/>
<text x="40" y="43" class="title">AWS VPC Peering — EWB Project</text>
<text x="40" y="72" class="subtitle">Actual observed environment • us-east-1 (N. Virginia) • private connectivity between two VPCs</text>
<!-- Internet / IGW -->
<rect x="38" y="91" width="1524" height="485" rx="18" fill="#fbfdff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="58" y="120" class="subhead">AWS Region: us-east-1</text>
<rect x="70" y="145" width="745" height="405" rx="16" class="vpcA"/>
<text x="94" y="180" class="head">VPC A — 10.10.0.0/16</text>
<text x="94" y="203" class="small">vpc-094290dd996bdde79</text>
<rect x="92" y="220" width="280" height="300" rx="12" class="public"/>
<text x="108" y="248" class="subhead">Public Subnet A</text>
<text x="108" y="270" class="text">10.10.1.0/24</text>
<text x="108" y="290" class="small">subnet-0bca7727144ff4450</text>
<rect x="113" y="316" width="238" height="181" rx="10" class="inst"/>
<text x="132" y="345" class="subhead">Bastion Host · EC2</text>
<text x="132" y="374" class="ip">Private: 10.10.1.10</text>
<text x="132" y="399" class="ip">Public: 32.192.245.103</text>
<text x="132" y="424" class="small">i-080bd656190adfe0c</text>
<text x="132" y="455" class="small">SSH entry point</text>
<!-- IGW to bastion -->
<rect x="98" y="81" width="236" height="43" rx="10" fill="#eef2ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="216" y="108" text-anchor="middle" class="subhead">Internet Gateway</text>
<path d="M216 124 L216 143 L216 312" class="line" marker-end="url(#arrow)"/>
<text x="235" y="139" class="small">0.0.0.0/0</text>
<!-- Private app A -->
<rect x="397" y="220" width="395" height="300" rx="12" class="private"/>
<text x="415" y="248" class="subhead">Private Subnet A</text>
<text x="415" y="270" class="text">10.10.2.0/24</text>
<text x="415" y="290" class="small">subnet-08c38e5c7cf56cf16</text>
<rect x="426" y="316" width="336" height="181" rx="10" class="inst"/>
<text x="446" y="345" class="subhead">App-A · EC2</text>
<text x="446" y="376" class="ip">Private IP: 10.10.2.108</text>
<text x="446" y="402" class="small">i-005788d06eff77db3</text>
<text x="446" y="435" class="small">No public IPv4 observed</text>
<path d="M351 404 L425 404" class="line" marker-end="url(#arrow)"/>
<text x="388" y="388" text-anchor="middle" class="small">SSH</text>
<text x="388" y="422" text-anchor="middle" class="small">(via bastion)</text>
<!-- VPC B -->
<rect x="1052" y="145" width="485" height="405" rx="16" class="vpcB"/>
<text x="1078" y="180" class="head">VPC B — 10.20.0.0/16</text>
<text x="1078" y="203" class="small">vpc-05463d53d9e3da06c</text>
<rect x="1078" y="220" width="433" height="300" rx="12" class="private"/>
<text x="1096" y="248" class="subhead">Private Subnet B</text>
<text x="1096" y="270" class="text">10.20.1.0/24</text>
<text x="1096" y="290" class="small">subnet-034834e10587f4b19</text>
<rect x="1103" y="316" width="382" height="181" rx="10" class="inst"/>
<text x="1124" y="345" class="subhead">App-B · EC2</text>
<text x="1124" y="376" class="ip">Private IP: 10.20.1.226</text>
<text x="1124" y="402" class="small">i-03eb8ec8840385621</text>
<text x="1124" y="435" class="small">No public IPv4 observed</text>
<!-- Peering -->
<rect x="833" y="183" width="199" height="112" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
<text x="932" y="210" text-anchor="middle" class="subhead">VPC Peering</text>
<text x="932" y="232" text-anchor="middle" class="small">Active</text>
<text x="932" y="254" text-anchor="middle" class="small">pcx-0cf7c6b7b06ee3eeb</text>
<circle cx="932" cy="405" r="47" fill="#fff" stroke="#7c3aed" stroke-width="3"/>
<path d="M901 405 Q932 373 963 405 Q932 437 901 405" fill="none" stroke="#7c3aed" stroke-width="3"/>
<path d="M792 375 L884 375" class="purple" marker-end="url(#purpleArrow)"/>
<path d="M979 375 L1078 375" class="purple" marker-end="url(#purpleArrow)"/>
<path d="M792 420 L1077 420" class="green" marker-end="url(#greenArrow)"/>
<path d="M1077 446 L792 446" class="blue" marker-end="url(#blueArrow)"/>
<text x="932" y="475" text-anchor="middle" class="small">Private traffic</text>
<text x="932" y="494" text-anchor="middle" class="small">10.10.0.0/16 ⇄ 10.20.0.0/16</text>
<!-- route table panels -->
<rect x="38" y="598" width="492" height="278" rx="12" class="route"/>
<text x="58" y="631" class="routehead">VPC A Public Route Table</text>
<text x="58" y="655" class="small">rtb-0bffd516469dc9220</text>
<rect x="56" y="677" width="456" height="32" fill="#e9ddff" stroke="#c4b5fd"/>
<text x="70" y="698" class="subhead">Destination</text><text x="274" y="698" class="subhead">Target</text>
<line x1="56" y1="709" x2="512" y2="709" stroke="#a78bfa"/><text x="70" y="733" class="text">10.10.0.0/16</text><text x="274" y="733" class="text">local</text>
<line x1="56" y1="745" x2="512" y2="745" stroke="#c4b5fd"/><text x="70" y="769" class="text">0.0.0.0/0</text><text x="274" y="769" class="text">Internet Gateway</text>
<line x1="56" y1="781" x2="512" y2="781" stroke="#c4b5fd"/><text x="70" y="805" class="text">10.20.0.0/16</text><text x="274" y="805" class="text">pcx-0cf7c6b7b06ee3eeb</text>
<text x="58" y="849" class="small">Associated with public subnet A</text>
<rect x="554" y="598" width="492" height="278" rx="12" class="route"/>
<text x="574" y="631" class="routehead">VPC A Private Route Table</text>
<text x="574" y="655" class="small">rtb-0df315a397a97459a</text>
<rect x="572" y="677" width="456" height="32" fill="#e9ddff" stroke="#c4b5fd"/>
<text x="586" y="698" class="subhead">Destination</text><text x="790" y="698" class="subhead">Target</text>
<line x1="572" y1="709" x2="1028" y2="709" stroke="#a78bfa"/><text x="586" y="733" class="text">10.10.0.0/16</text><text x="790" y="733" class="text">local</text>
<line x1="572" y1="745" x2="1028" y2="745" stroke="#c4b5fd"/><text x="586" y="769" class="text">10.20.0.0/16</text><text x="790" y="769" class="small">pcx-0cf7c6b7b06ee3eeb</text>
<text x="574" y="849" class="small">Associated with private subnet A</text>
<rect x="1070" y="598" width="492" height="278" rx="12" class="route"/>
<text x="1090" y="631" class="routehead">VPC B Private Route Table</text>
<text x="1090" y="655" class="small">rtb-0e04e73e930ddf38c</text>
<rect x="1088" y="677" width="456" height="32" fill="#e9ddff" stroke="#c4b5fd"/>
<text x="1102" y="698" class="subhead">Destination</text><text x="1306" y="698" class="subhead">Target</text>
<line x1="1088" y1="709" x2="1544" y2="709" stroke="#a78bfa"/><text x="1102" y="733" class="text">10.20.0.0/16</text><text x="1306" y="733" class="text">local</text>
<line x1="1088" y1="745" x2="1544" y2="745" stroke="#c4b5fd"/><text x="1102" y="769" class="text">10.10.0.0/16</text><text x="1306" y="769" class="small">pcx-0cf7c6b7b06ee3eeb</text>
<text x="1090" y="849" class="small">Associated with private subnet B</text>
<rect x="38" y="900" width="1524" height="116" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="58" y="930" class="subhead">Connectivity evidence</text>
<text x="58" y="957" class="text">• SSH to App-B uses the bastion as a jump host; App-B has no public IPv4 address.</text>
<text x="58" y="982" class="text">• Observed ping tests between App-A (10.10.2.108) and App-B (10.20.1.226) returned 4/4 replies after rules were corrected.</text>
<text x="58" y="1004" class="small">Keep the private key on your laptop. Do not upload PEM files or AWS credentials to GitHub.</text>
</svg>